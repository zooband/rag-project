[project]
name = "magazine-rag"
version = "0.1.0"
description = "数据检索与 RAG 方向实践项目"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "faiss-cpu>=1.8",
    "numpy>=2.0",
    "jieba>=0.42",
    "PyMuPDF>=1.23",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
rag-query = "cli:main"
